# Default values for alibabacloud-erdma-controller.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# controller will not be deployed if localERIDiscovery is set
controller:
  replicaCount: 2
  image:
    repository: registry.aliyuncs.com/erdma/controller
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  nodeSelector: {}
  affinity: {}

agent:
  image:
    repository: registry.aliyuncs.com/erdma/agent
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  # Installation profile, not three kernel modes: default=Standard,
  # compat/ofed=Compat. Empty auto-selects ofed when nvidia-smi is present.
  preferDriver: ""
  # Package version for first installation, including ofed. Existing drivers
  # are reused, not upgraded. All lifsea profiles use kernel-modules instead.
  erdmaInstallerVersion: "latest"
  allocateAllDevices: false
  jumboFrameMTU: 8500
  # format: 
  # expose specific eris for matched node: - <instance_id> <eri-0>/<eri-1>/... 
  # expose specific eris for unmatched node: - i-* <eri-0>/<eri-1>/...
  # expose all eris for unmatched node: - i-* erdma_*
  exposedLocalERIs:
    - i-XXX erdma_0/erdma_1
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

nodeSelector: {}

tolerations:
  - operator: "Exists"

affinity: {}

webhookFailurePolicy: Ignore
webhookTimeoutSeconds: 10

config:
  region: ""
  manageNonOwnedENIs: true
  clusterDomain: ""
  enableDevicePlugin: true
  enableWebhook: false
  enableInitContainerInject: true
  smcInitImage: ""
  localERIDiscovery: false
  # Concurrent Node reconciles create ERIs through ECS OpenAPI. Defaults to 10 when omitted or zero.
  nodeMaxConcurrentReconciles: 10
  # Concurrent ERdmaDevice reconciles attach and configure ERIs. Defaults to 20 when omitted or zero.
  erdmaDeviceMaxConcurrentReconciles: 20
  # ECS OpenAPI requests per minute.
  rateLimit:
    DescribeInstances: 500
    DescribeNetworkInterfaces: 1000
    CreateNetworkInterface: 250
    ModifyNetworkInterfaceAttribute: 500
    TagResources: 500
    DescribeInstanceTypes: 200
    AttachNetworkInterface: 250
    DescribeInstanceAttribute: 1000

credentials:
  type: ""
  accessKeyID: ""
  accessKeySecret: ""
